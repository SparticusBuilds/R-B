<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roberts &amp; Bumford — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep: #1f3327;
    --parchment: #f3eee2;
    --wheat: #c9a227;
    --rust: #8a3b28;
    --charcoal: #211f1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--parchment);
    color: var(--charcoal);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 480px; width: 100%; text-align: center; }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.8rem;
    color: var(--green-deep);
    margin-bottom: 8px;
  }
  p.sub { color: #6b6659; font-size: 0.92rem; margin-bottom: 40px; }
  .links { display: flex; flex-direction: column; gap: 14px; }
  a.card {
    display: block;
    text-decoration: none;
    background: #fff;
    border: 1px solid rgba(31,51,39,0.14);
    border-radius: 4px;
    padding: 20px 22px;
    text-align: left;
    transition: border-color 0.15s;
  }
  a.card:hover { border-color: var(--wheat); }
  a.card .label {
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rust);
    margin-bottom: 6px;
  }
  a.card .title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.15rem;
    color: var(--green-deep);
  }
  a.card .desc { font-size: 0.85rem; color: #6b6659; margin-top: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Roberts &amp; Bumford</h1>
    <p class="sub">Two things live in this repo — pick one.</p>
    <div class="links">
      <a class="card" href="./site/">
        <div class="label">Website mockup</div>
        <div class="title">R&amp;B Agricultural Stores</div>
        <div class="desc">Single-page site mockup, for review only.</div>
      </a>
      <a class="card" href="./pos/">
        <div class="label">Personal project</div>
        <div class="title">Stock &amp; Accounts prototype</div>
        <div class="desc">Working POS prototype — see README before treating this as more than a demo.</div>
      </a>
    </div>
  </div>
</body>
</html>
