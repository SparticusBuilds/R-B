<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R&amp;B Stock &amp; Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: 'Inter', sans-serif; }
</style>
<script>
  // window.storage only exists inside Claude's artifact environment. Outside it (e.g. deployed
  // here on GitHub Pages), this shim gives the exact same get/set/delete/list shape but backed
  // by the browser's own localStorage, so the app code itself doesn't need to know which
  // environment it's running in. Note: this means data is per-browser, not shared between
  // devices or locations — see the README before treating this as more than a local demo.
  if (!window.storage) {
    window.storage = {
      async get(key) {
        const raw = localStorage.getItem(key);
        if (raw === null) return null;
        return { key, value: raw, shared: false };
      },
      async set(key, value) {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      },
      async delete(key) {
        const existed = localStorage.getItem(key) !== null;
        localStorage.removeItem(key);
        return { key, deleted: existed, shared: false };
      },
      async list(prefix) {
        const keys = Object.keys(localStorage).filter((k) => !prefix || k.startsWith(prefix));
        return { keys, prefix: prefix || null, shared: false };
      },
    };
  }
</script>
</head>
<body>
  <div id="root"></div>
  <script src="bundle.js?v=15"></script>
</body>
</html>
